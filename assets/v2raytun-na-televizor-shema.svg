<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 690" width="380" height="690" role="img" aria-labelledby="t d">
  <title id="t">Как перенести ключ v2rayTun с телефона на телевизор</title>
  <desc id="d">Три пути от телефона к телевизору с Android TV: QR-код с экрана телевизора, текст через приложение-пульт или передачу файлов, набор с пульта.</desc>
  <rect width="380" height="690" rx="18" fill="#16100d"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="190" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#f4e9d8">Ключ с телефона на телевизор</text>

    <!-- телефон -->
    <rect x="120" y="62" width="140" height="76" rx="14" fill="#2c221c" stroke="#f3b664" stroke-width="2"/>
    <rect x="178" y="70" width="24" height="4" rx="2" fill="#a8937c"/>
    <text x="190" y="102" text-anchor="middle" font-size="17" font-weight="700" fill="#f4e9d8">Телефон</text>
    <text x="190" y="125" text-anchor="middle" font-size="16" fill="#c7b39c">ключ или ссылка</text>

    <!-- ствол -->
    <path d="M190 138 V156 H34 V560" fill="none" stroke="#3e3129" stroke-width="3"/>
    <path d="M34 214 H50 M34 340 H50 M34 466 H50" stroke="#3e3129" stroke-width="3"/>

    <!-- 1. QR -->
    <rect x="50" y="170" width="314" height="96" rx="12" fill="#211915" stroke="#3e3129" stroke-width="1.5"/>
    <circle cx="74" cy="196" r="13" fill="#f3b664"/>
    <text x="74" y="202" text-anchor="middle" font-size="16" font-weight="700" fill="#1a110b">1</text>
    <text x="98" y="202" font-size="18" font-weight="700" fill="#f4e9d8">QR-код на экране ТВ</text>
    <text x="66" y="228" font-size="16" fill="#c7b39c">телевизор показывает код,</text>
    <text x="66" y="250" font-size="16" fill="#c7b39c">v2rayTun на телефоне сканирует</text>

    <!-- 2. текст -->
    <rect x="50" y="296" width="314" height="96" rx="12" fill="#211915" stroke="#3e3129" stroke-width="1.5"/>
    <circle cx="74" cy="322" r="13" fill="#f3b664"/>
    <text x="74" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#1a110b">2</text>
    <text x="98" y="328" font-size="18" font-weight="700" fill="#f4e9d8">Текстом по Wi-Fi</text>
    <text x="66" y="354" font-size="16" fill="#c7b39c">пульт в телефоне или передача</text>
    <text x="66" y="376" font-size="16" fill="#c7b39c">текста, затем «Вставить»</text>

    <!-- 3. пульт -->
    <rect x="50" y="422" width="314" height="96" rx="12" fill="#211915" stroke="#3e3129" stroke-width="1.5"/>
    <circle cx="74" cy="448" r="13" fill="#a9d19a"/>
    <text x="74" y="454" text-anchor="middle" font-size="16" font-weight="700" fill="#1a110b">3</text>
    <text x="98" y="454" font-size="18" font-weight="700" fill="#f4e9d8">Набор с пульта</text>
    <text x="66" y="480" font-size="16" fill="#c7b39c">долго, зато без лишних</text>
    <text x="66" y="502" font-size="16" fill="#c7b39c">программ; ссылка короче ключа</text>

    <!-- к телевизору -->
    <path d="M34 560 H120" fill="none" stroke="#3e3129" stroke-width="3"/>
    <path d="M112 552 L122 560 L112 568" fill="none" stroke="#3e3129" stroke-width="3" stroke-linejoin="round"/>

    <!-- телевизор -->
    <rect x="128" y="530" width="214" height="78" rx="8" fill="#0f0b09" stroke="#f3b664" stroke-width="2"/>
    <text x="235" y="563" text-anchor="middle" font-size="17" font-weight="700" fill="#f4e9d8">Android TV</text>
    <text x="235" y="588" text-anchor="middle" font-size="16" fill="#c7b39c">импорт в v2rayTun</text>
    <path d="M205 620 H265" stroke="#f3b664" stroke-width="3" stroke-linecap="round"/>

    <circle cx="66" cy="640" r="6" fill="#f3b664"/>
    <text x="80" y="645" font-size="16" fill="#a8937c">зависит от версии и модели</text>
    <circle cx="66" cy="668" r="6" fill="#a9d19a"/>
    <text x="80" y="673" font-size="16" fill="#a8937c">нужны только пульт и терпение</text>
  </g>
</svg>
